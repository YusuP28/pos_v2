name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Clean
        run: flutter clean

      - name: Pub Get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: List APK
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Pick arm64
        run: |
          cd build/app/outputs/flutter-apk
          cp app-arm64-v8a-release.apk pos_v2-arm64.apk
          ls -lh pos_v2-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pos-v2-arm64
          path: build/app/outputs/flutter-apk/pos_v2-arm64.apk

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/pos_v2-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
