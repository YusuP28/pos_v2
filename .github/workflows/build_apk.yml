name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Get Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build Release APK (split ABI)
        run: flutter build apk --release --split-per-abi --target-platform=android-arm64

      - name: Rename APK
        run: |
          cd build/app/outputs/flutter-apk
          ls -la
          if [ -f app-arm64-v8a-release.apk ]; then
            cp app-arm64-v8a-release.apk pos_v2-arm64.apk
          else
            cp app-release.apk pos_v2-arm64.apk
          fi

      - name: Upload APK to Actions
        uses: actions/upload-artifact@v4
        with:
          name: pos-v2-arm64-apk
          path: build/app/outputs/flutter-apk/pos_v2-arm64.apk

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/pos_v2-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
