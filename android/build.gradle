allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

// Patch: legacy plugin seperti blue_thermal_printer tidak define namespace.
// Dipasang saat plugin library diterapkan, bukan afterEvaluate.
subprojects { subproject ->
    subproject.plugins.withId('com.android.library') {
        def androidExt = subproject.extensions.findByName('android')
        if (androidExt != null && androidExt.namespace == null) {
            def manifestFile = subproject.file('src/main/AndroidManifest.xml')
            if (manifestFile.exists()) {
                def pkg = new groovy.util.XmlSlurper()
                    .parse(manifestFile).@package.text()
                if (pkg != null && pkg.toString().trim().isNotEmpty()) {
                    androidExt.namespace = pkg.toString().trim()
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
