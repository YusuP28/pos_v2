allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

// Patch: legacy plugin (blue_thermal_printer 1.2.3) tidak punya namespace
// dan compileSdk. AGP 8+ wajibkan keduanya. Inject dari AndroidManifest.
subprojects { subproject ->
    subproject.plugins.withId('com.android.library') {
        def androidExt = subproject.extensions.findByName('android')
        if (androidExt != null) {
            // 1) Namespace
            if (androidExt.namespace == null) {
                def manifestFile = subproject.file('src/main/AndroidManifest.xml')
                if (manifestFile.exists()) {
                    def pkg = new groovy.util.XmlSlurper()
                        .parse(manifestFile).@package.text()
                    if (pkg != null && pkg.toString().trim().length() > 0) {
                        androidExt.namespace = pkg.toString().trim()
                    }
                }
            }
            // 2) compileSdk
            try {
                if (androidExt.compileSdkVersion == null) {
                    androidExt.compileSdkVersion = 36
                }
            } catch (Exception ignored) {
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
